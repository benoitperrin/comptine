[project]
name = "comptine"
version = "0.1.0"
description = "Unofficial Python client and CLI for the Urssaf 'Tierce Déclaration Pajemploi' API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Benoît Perrin", email = "perrin.benoit@gmail.com" }]
requires-python = ">=3.11"
keywords = ["urssaf", "pajemploi", "tierce-declaration", "tdpaje", "payroll", "france"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "platformdirs>=4.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.2,<2.0",
    "uvicorn>=0.30",
]
dev = [
    "mcp[cli]>=1.2,<2.0",
    "uvicorn>=0.30",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
comptine = "comptine.cli:main"
comptine-mcp = "comptine.mcp_server:main"

[project.urls]
Repository = "https://github.com/benoitperrin/comptine"
Issues = "https://github.com/benoitperrin/comptine/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comptine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "PL",            # pylint subset
    "RUF",           # ruff-specific
]
ignore = [
    "PLR0913",       # too many args (CLI builders need them)
    "PLR2004",       # magic values in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
